spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/vira?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:vira_app}
    password: ${DB_PASSWORD:vira_app_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://vira.daoductam.dpdns.org}
  mail:
    reset-url: ${RESET_PASSWORD_URL:https://vira.daoductam.dpdns.org/reset-password}

logging:
  level:
    org.springframework.security: WARN
    vn.vira: INFO
